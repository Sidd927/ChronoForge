<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="CHOKEPOINT proof-of-concept pipeline: twin JSON, load and validate, attack graph, planner, verifier, outputs; baselines computed from the same graph">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B6577"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="250" rx="12" fill="#FFFFFF"/>
  <text x="20" y="28" font-size="13" font-weight="700" fill="#0F1B2D" letter-spacing="0.5">WHAT THE PROOF OF CONCEPT ACTUALLY RUNS</text>
  <text x="880" y="28" font-size="11" text-anchor="end" fill="#5B6577">all in prototype/chokepoint · Python standard library only</text>

  <!-- input -->
  <rect x="20" y="52" width="150" height="112" rx="8" fill="#F4F6F9" stroke="#D5DAE3"/>
  <text x="95" y="74" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0F1B2D">Twin JSON</text>
  <text x="95" y="93" font-size="10.5" text-anchor="middle" fill="#5B6577">assets · services</text>
  <text x="95" y="108" font-size="10.5" text-anchor="middle" fill="#5B6577">findings (KEV/EPSS</text>
  <text x="95" y="122" font-size="10.5" text-anchor="middle" fill="#5B6577">snapshot) · rules</text>
  <text x="95" y="137" font-size="10.5" text-anchor="middle" fill="#5B6577">required flows</text>
  <text x="95" y="152" font-size="10.5" text-anchor="middle" fill="#5B6577">origins · critical</text>

  <!-- core -->
  <rect x="196" y="44" width="560" height="128" rx="10" fill="#12233F"/>
  <text x="212" y="64" font-size="10.5" font-weight="700" fill="#DCE3EE" letter-spacing="0.8">DETERMINISTIC CORE · engine.py</text>
  <g font-size="12" fill="#FFFFFF">
    <rect x="212" y="74" width="118" height="84" rx="7" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <text x="271" y="98" text-anchor="middle" font-weight="700">1 · Load</text>
    <text x="271" y="116" text-anchor="middle" font-size="10.5" fill="#DCE3EE">Twin.load()</text>
    <text x="271" y="131" text-anchor="middle" font-size="10.5" fill="#DCE3EE">schema</text>
    <text x="271" y="145" text-anchor="middle" font-size="10.5" fill="#DCE3EE">validation</text>

    <rect x="350" y="74" width="118" height="84" rx="7" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <text x="409" y="98" text-anchor="middle" font-weight="700">2 · Graph</text>
    <text x="409" y="116" text-anchor="middle" font-size="10.5" fill="#DCE3EE">rule ∧ weakness</text>
    <text x="409" y="131" text-anchor="middle" font-size="10.5" fill="#DCE3EE">or stored creds</text>
    <text x="409" y="145" text-anchor="middle" font-size="10.5" fill="#DCE3EE">⇒ edge u → v</text>

    <rect x="488" y="74" width="118" height="84" rx="7" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <text x="547" y="98" text-anchor="middle" font-weight="700">3 · Plan</text>
    <text x="547" y="116" text-anchor="middle" font-size="10.5" fill="#DCE3EE">exact branch &amp;</text>
    <text x="547" y="131" text-anchor="middle" font-size="10.5" fill="#DCE3EE">bound; flows are</text>
    <text x="547" y="145" text-anchor="middle" font-size="10.5" fill="#DCE3EE">hard constraints</text>

    <rect x="626" y="74" width="118" height="84" rx="7" fill="#0B7A55"/>
    <text x="685" y="98" text-anchor="middle" font-weight="700">4 · Verify</text>
    <text x="685" y="116" text-anchor="middle" font-size="10.5">recompute from</text>
    <text x="685" y="131" text-anchor="middle" font-size="10.5">scratch: 0 paths,</text>
    <text x="685" y="145" text-anchor="middle" font-size="10.5">0 broken flows</text>
  </g>
  <g stroke="#9FB0C8" stroke-width="1.6" marker-end="url(#a)">
    <line x1="330" y1="116" x2="348" y2="116"/><line x1="468" y1="116" x2="486" y2="116"/><line x1="606" y1="116" x2="624" y2="116"/>
  </g>
  <line x1="170" y1="108" x2="194" y2="108" stroke="#5B6577" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- outputs -->
  <rect x="780" y="52" width="100" height="112" rx="8" fill="#F4F6F9" stroke="#D5DAE3"/>
  <text x="830" y="74" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0F1B2D">Outputs</text>
  <text x="830" y="95" font-size="10.5" text-anchor="middle" fill="#5B6577">console report</text>
  <text x="830" y="112" font-size="10.5" text-anchor="middle" fill="#5B6577">results.json</text>
  <text x="830" y="129" font-size="10.5" text-anchor="middle" fill="#5B6577">attack_map.svg</text>
  <text x="830" y="146" font-size="10.5" text-anchor="middle" fill="#5B6577">exit 0 iff PASS</text>
  <line x1="756" y1="108" x2="778" y2="108" stroke="#5B6577" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- guardrail + baselines -->
  <rect x="488" y="188" width="118" height="44" rx="7" fill="#FDF1EE" stroke="#C8402B"/>
  <text x="547" y="206" font-size="11" font-weight="700" text-anchor="middle" fill="#C8402B">KEV guardrail</text>
  <text x="547" y="222" font-size="10" text-anchor="middle" fill="#5B6577">seeds the search</text>
  <line x1="547" y1="188" x2="547" y2="160" stroke="#C8402B" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="626" y="188" width="254" height="44" rx="7" fill="#F4F6F9" stroke="#D5DAE3"/>
  <text x="753" y="206" font-size="11" font-weight="700" text-anchor="middle" fill="#0F1B2D">Baselines (same graph)</text>
  <text x="753" y="222" font-size="10" text-anchor="middle" fill="#5B6577">CVSS / KEV / EPSS order · optimal patch-only</text>
  <path d="M409,158 L409,243 L753,243 L753,236" fill="none" stroke="#5B6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <path d="M880,210 L892,210 L892,108 L882,108" fill="none" stroke="#5B6577" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>
</svg>
